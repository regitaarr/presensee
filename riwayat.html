<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensee</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #f0f9ff;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --success: #10b981;
            --success-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--slate-900);
            -webkit-font-smoothing: antialiased;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: var(--radius-2xl);
            box-shadow: 
                0 25px 50px -12px rgba(15, 23, 42, 0.1),
                0 0 0 1px rgba(15, 23, 42, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 640px;
            max-height: 92vh;
        }

        .content {
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            background: #ffffff;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--slate-200);
            border-radius: 4px;
        }

        .riwayat-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            padding: 20px;
            border: 1px solid var(--slate-200);
            box-shadow: 0 4px 20px -5px rgba(15, 23, 42, 0.05);
        }

        /* Modern Summary Cards */
        .summary-card {
            background: var(--slate-50);
            border-radius: var(--radius-md);
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--slate-200);
            transition: all 0.2s ease;
        }
        .summary-card:hover {
            background: #ffffff;
            border-color: var(--slate-300);
        }
        .sum-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--slate-500);
            margin-bottom: 4px;
        }
        .sum-num {
            font-size: 22px;
            font-weight: 800;
            color: var(--slate-900);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }
        .sum-unit {
            font-size: 10px;
            color: var(--slate-400);
            font-weight: 500;
            margin-top: 2px;
        }

        /* Period Navigator */
        .nav-btn {
            border: 1px solid var(--slate-200);
            background: var(--slate-50);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            color: var(--slate-700);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            background: #ffffff;
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Calendar */
        .cal-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--slate-400);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--slate-100);
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.01em;
            text-decoration: none;
        }
        .btn-outline {
            background: #ffffff;
            color: var(--slate-700);
            border: 1.5px solid var(--slate-200);
        }
        .btn-outline:hover {
            background: var(--slate-50);
            border-color: var(--slate-300);
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: flex-start;
                min-height: 100dvh;
                height: 100dvh;
                overflow: hidden;
            }
            .phone-container {
                border-radius: 0;
                max-width: 100%;
                min-height: 100dvh;
                max-height: 100dvh;
                box-shadow: none;
                flex-grow: 1;
            }
            #view-riwayat.content {
                padding-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="phone-container">

        <!-- RIWAYAT VIEW -->
        <div id="view-riwayat" class="view active content">
            <div class="riwayat-card">
                <h3 style="font-size:18px; font-weight:700; color:var(--slate-900); margin:0 0 16px; text-align:center;">Riwayat Kehadiran</h3>

                <!-- Clean Summary Cards (No Emojis) -->
                <div id="summary-cards" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom: 18px;">
                    <div class="summary-card" id="card-telat">
                        <div class="sum-label">Terlambat</div>
                        <div class="sum-num" id="count-telat" style="color:#d97706;">0</div>
                        <div class="sum-unit">Hari</div>
                    </div>
                    <div class="summary-card" id="card-cepat">
                        <div class="sum-label">Pulang Cepat</div>
                        <div class="sum-num" id="count-cepat" style="color:#ea580c;">0</div>
                        <div class="sum-unit">Hari</div>
                    </div>
                    <div class="summary-card" id="card-izin">
                        <div class="sum-label">Izin &amp; Sakit</div>
                        <div class="sum-num" id="count-izin" style="color:var(--primary);">0</div>
                        <div class="sum-unit">Hari</div>
                    </div>
                </div>
                    

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <button id="btn-prev-period"
                        style="border:none; background:#f0f4f9; width:44px; height:44px; border-radius:12px; cursor:pointer; font-weight:bold; font-size:18px; color:#555; transition:0.2s; display:flex; align-items:center; justify-content:center;">
                        &lt;
                    </button>
                    <div style="text-align:center;">
                        <div id="period-title" style="font-weight:800; font-size:16px; color:#1a237e;">Memuat...</div>
                        <div id="period-date" style="font-size:12px; color:#666;">-</div>
                    </div>
                    <button id="btn-next-period"
                        style="border:none; background:#f0f4f9; width:44px; height:44px; border-radius:12px; cursor:pointer; font-weight:bold; font-size:18px; color:#555; transition:0.2s; display:flex; align-items:center; justify-content:center;">
                        &gt;
                    </button>
                </div>

                <div class="calendar-container">
                    <div class="cal-header"
                        style="display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; font-size:12px; font-weight:700; color:#444; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px; padding-right:5px;">
                        <div>Sen</div>
                        <div>Sel</div>
                        <div>Rab</div>
                        <div>Kam</div>
                        <div>Jum</div>
                        <div>Sab</div>
                        <div>Min</div>
                    </div>
                    <div id="calendar-grid"
                        style="display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; row-gap:10px; max-height: 280px; overflow-y: auto; overflow-x: hidden; padding-right: 5px; align-content: flex-start;">
                        <div style="grid-column: span 7; color:#999; padding:20px; font-size:12px;">Memuat kalender...</div>
                    </div>
                </div>

                <div id="holiday-list-container"
                    style="display:none; margin-top:15px; background:#fffbf7; border:1px solid #ffe3b3; border-radius:10px; padding:12px;">
                    <div style="font-size:12px; font-weight:800; color:#d35400; margin-bottom:5px;">Daftar Libur Nasional:</div>
                    <div id="holiday-list-ul"
                        style="font-size:11.5px; color:#555; display:flex; flex-direction:column; gap:4px;"></div>
                </div>

                <div
                    style="display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; font-size:11px; font-weight:600; color:#333;">
                    <div style="display:flex; align-items:center; gap:4px;"><span
                            style="color:#2ecc71; font-size:12px;">✔</span> Hadir disetujui</div>
                    <div style="display:flex; align-items:center; gap:4px;"><span
                            style="color:#27ae60; font-weight:900; font-size:12px;">–</span> Izin/Sakit disetujui
                    </div>
                    <div style="display:flex; align-items:center; gap:4px;"><span
                            style="color:#e74c3c; font-size:12px;">●</span> Tidak Hadir</div>
                    <div style="display:flex; align-items:center; gap:4px;"><span
                            style="color:#95a5a6; font-size:12px;">○</span> Belum Diisi</div>
                    <div style="display:flex; align-items:center; gap:4px;"><span
                            style="color:#2c3e50; font-size:12px;">■</span> Weekend</div>
                    <div style="display:flex; align-items:center; gap:4px;"><span
                            style="color:#c0392b; font-size:12px;">■</span> Libur Nasional</div>
                </div>

                <a href="index.html" class="btn btn-danger"
                    style="text-decoration:none; margin-top:30px; font-weight:700;">
                    Kembali
                </a>
            </div>
        </div>

    </div>

    <!-- Firebase SDK Modular (v10.8) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase kamu
        const firebaseConfig = {
            apiKey: "AIzaSyDe394Hog3cODzHBWgC00jtQybKq_Ul4l4",
            authDomain: "presensee-d653b.firebaseapp.com",
            databaseURL: "https://presensee-d653b-default-rtdb.firebaseio.com",
            projectId: "presensee-d653b",
            storageBucket: "presensee-d653b.firebasestorage.app",
            messagingSenderId: "983111308568",
            appId: "1:983111308568:web:de94c7403005a596083a6d",
            measurementId: "G-9WBWFBFGYQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State variables
        let globalDataMap = {};

        // Hard-coded libur nasional sebagai fallback utama
        const LIBUR_NASIONAL = {
            "2026-12-24": "Cuti Bersama Hari Raya Natal",
            "2026-12-25": "Hari Raya Natal",
            "2027-01-01": "Tahun Baru 2027",
            "2027-01-05": "Isra Mi'raj Nabi Muhammad SAW",
            "2027-02-05": "Cuti Bersama Tahun Baru Imlek",
            "2027-02-06": "Tahun Baru Imlek",
            "2027-03-08": "Hari Raya Nyepi",
            "2027-03-09": "Cuti Bersama Hari Raya Idul Fitri 1448 H",
            "2027-03-10": "Hari Raya Idul Fitri 1448 H",
            "2027-03-11": "Hari Raya Idul Fitri 1448 H",
            "2027-03-12": "Cuti Bersama Hari Raya Idul Fitri 1448 H",
            "2027-03-15": "Cuti Bersama Hari Raya Idul Fitri 1448 H"
        };

        let nationalHolidayMap = { ...LIBUR_NASIONAL };

        const periods = [
            { title: "Periode 1", start: "2026-09-21", end: "2026-10-20" },
            { title: "Periode 2", start: "2026-10-21", end: "2026-11-20" },
            { title: "Periode 3", start: "2026-11-21", end: "2026-12-20" },
            { title: "Periode 4", start: "2026-12-21", end: "2027-01-20" },
            { title: "Periode 5", start: "2027-01-21", end: "2027-02-20" },
            { title: "Periode 6", start: "2027-02-21", end: "2027-03-20" }
        ];

        let currentPeriodIndex = 0;

        // Auth Listeners
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Merge dengan data Firebase (jika ada)
                    try {
                        const qLibur = await getDocs(collection(db, "libur_nasional"));
                        qLibur.forEach(d => {
                            if (d.data().tanggal) {
                                nationalHolidayMap[d.data().tanggal] = d.data().keterangan || "Libur Nasional";
                            }
                        });
                    } catch (e) { }

                    loadRecap(user.uid);
                } catch (e) {
                    console.warn(e);
                }
            } else {
                window.location.href = "index.html"; // Redirect ke beranda jika belum login
            }
        });

        // Pagination Controls
        document.getElementById('btn-prev-period').onclick = () => {
            if (currentPeriodIndex > 0) {
                currentPeriodIndex--;
                renderCalendarForPeriod(currentPeriodIndex);
            }
        };

        document.getElementById('btn-next-period').onclick = () => {
            if (currentPeriodIndex < periods.length - 1) {
                currentPeriodIndex++;
                renderCalendarForPeriod(currentPeriodIndex);
            }
        };

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
        function formatPeriodeDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        }

                function updateSummaryForPeriod(startDate, endDate) {
            let telat = 0, cepat = 0, izinSakit = 0;
            const startStr = startDate.toISOString().split('T')[0];
            const endStr = endDate.toISOString().split('T')[0];

            Object.keys(globalDataMap).forEach(tgl => {
                if (tgl >= startStr && tgl <= endStr) {
                    const list = globalDataMap[tgl];
                    list.forEach(item => {
                        if (item.is_late || (item.status && item.status.toLowerCase().includes('telat')) || item.late_reason) {
                            telat++;
                        }
                        if (item.is_early_leave || (item.status && item.status.toLowerCase().includes('cepat')) || item.early_leave_reason) {
                            cepat++;
                        }
                        if (item.status === 'Izin' || item.status === 'Sakit' || item.leave_type) {
                            izinSakit++;
                        }
                    });
                }
            });

            const elTelat = document.getElementById('count-telat');
            const elCepat = document.getElementById('count-cepat');
            const elIzin = document.getElementById('count-izin');
            if (elTelat) elTelat.innerText = telat;
            if (elCepat) elCepat.innerText = cepat;
            if (elIzin) elIzin.innerText = izinSakit;
        }

        function renderCalendarForPeriod(index) {
            const period = periods[index];
            const startDate = new Date(period.start);
            const endDate = new Date(period.end);

            document.getElementById('period-title').innerText = period.title;
            document.getElementById('period-date').innerText = formatPeriodeDate(period.start) + ' - ' + formatPeriodeDate(period.end);
            updateSummaryForPeriod(startDate, endDate);

            // disable/enable buttons
            document.getElementById('btn-prev-period').style.opacity = index === 0 ? "0.3" : "1";
            document.getElementById('btn-prev-period').style.pointerEvents = index === 0 ? "none" : "auto";
            document.getElementById('btn-next-period').style.opacity = index === periods.length - 1 ? "0.3" : "1";
            document.getElementById('btn-next-period').style.pointerEvents = index === periods.length - 1 ? "none" : "auto";

            const calGrid = document.getElementById('calendar-grid');
            if (!calGrid) return;

            const totalDays = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
            let startDayOfWeek = startDate.getDay();
            let padStart = (startDayOfWeek === 0) ? 6 : startDayOfWeek - 1;

            let html = '';

            // Empty blocks before Day 1
            for (let i = 0; i < padStart; i++) {
                html += `<div style="background:#f9fafb; border-bottom:1px solid #f0f0f0;"></div>`;
            }

            let periodHolidays = [];

            for (let i = 0; i < totalDays; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);

                const tglStr = currentDate.toISOString().split('T')[0];
                const dayNum = currentDate.getDate();
                const dayOfWeek = currentDate.getDay(); // 0 is Sun, 6 is Sat

                const isNatHoliday = !!nationalHolidayMap[tglStr];
                const isPureWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                const isWeekend = isPureWeekend || isNatHoliday;

                if (isNatHoliday) {
                    periodHolidays.push({ tgl: tglStr, ket: nationalHolidayMap[tglStr] });
                }

                // Prioritas: libur nasional (merah) > weekend (abu) > presensi > belum diisi
                let iconHtml;
                if (isNatHoliday) {
                    iconHtml = `<span style="color:#c0392b; font-size:11px;" title="${nationalHolidayMap[tglStr]}">■</span>`;
                } else if (isPureWeekend) {
                    iconHtml = `<span style="color:#2c3e50; font-size:11px;">■</span>`;
                } else if (globalDataMap[tglStr] && globalDataMap[tglStr].length > 0) {
                    let hasHadir = globalDataMap[tglStr].some(d => (d.status && d.status.includes('Hadir') && !d.status.includes('Tidak Hadir')) || d.status === 'check_in' || d.status === 'check_out');
                    let hasIzinSakit = globalDataMap[tglStr].some(d => d.status === 'Izin' || d.status === 'Sakit' || d.leave_type);
                    if (hasHadir) {
                        iconHtml = `<span style="color:#2ecc71; font-size:11px;">✔</span>`;
                    } else if (hasIzinSakit) {
                        iconHtml = `<span style="color:#27ae60; font-weight:900; font-size:11px;">–</span>`;
                    } else {
                        iconHtml = `<span style="color:#e74c3c; font-size:11px;">●</span>`;
                    }
                } else {
                    iconHtml = `<span style="color:#95a5a6; font-size:11px;">○</span>`;
                }

                const todayStr = (new Date()).toISOString().split('T')[0];
                const isToday = (todayStr === tglStr);
                const circleStyles = isToday ? `border: 1px solid #1a237e; color:#1a237e; border-radius:50%; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center;` : `color:#555; height:24px; display:inline-flex; align-items:center; justify-content:center;`;

                let bgCell = "";
                if (isNatHoliday) bgCell = "background:#fdecea;"; // merah muda untuk libur nasional
                else if (isPureWeekend) bgCell = "background:#f0f0f0;"; // abu untuk weekend

                html += `
                <div style="${bgCell} padding:4px 0; display:flex; flex-direction:column; align-items:center; gap:8px; border-bottom:1px solid #f0f0f0;">
                    <span style="font-size:13px; padding-top:2px; ${circleStyles}">${dayNum}</span>
                    ${iconHtml}
                </div>`;
            }

            // Empty blocks after end date to complete a row
            let totalCells = padStart + totalDays;
            let remainder = totalCells % 7;
            if (remainder !== 0) {
                let padEnd = 7 - remainder;
                for (let i = 0; i < padEnd; i++) {
                    html += `<div style="background:#f9fafb; border-bottom:1px solid #f0f0f0;"></div>`;
                }
            }

            calGrid.innerHTML = html;

            const holContainer = document.getElementById('holiday-list-container');
            const holUl = document.getElementById('holiday-list-ul');
            if (periodHolidays.length > 0) {
                holContainer.style.display = 'block';
                let holHtml = '';
                periodHolidays.forEach(h => {
                    holHtml += `<div>• <b>${formatPeriodeDate(h.tgl)}</b> : ${h.ket}</div>`;
                });
                holUl.innerHTML = holHtml;
            } else {
                holContainer.style.display = 'none';
            }
        }

        // Rekapitulasi Initialization
        async function loadRecap(uid) {
            try {
                const q = query(
                    collection(db, "presensi"),
                    where("uid", "==", uid)
                );
                const querySnapshot = await getDocs(q);

                let dataMap = {};
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    let tgl = d.tanggal;
                    if (!dataMap[tgl]) {
                        dataMap[tgl] = [];
                    }
                    dataMap[tgl].push(d);
                });
                // Muat juga dari koleksi attendances (data baru)
                try {
                    const qAtt = query(collection(db, 'attendances'), where('user_id', '==', uid));
                    const snapAtt = await getDocs(qAtt);
                    snapAtt.forEach((docSnap) => {
                        const d = docSnap.data();
                        let tgl = d.tanggal;
                        if (tgl) {
                            if (!dataMap[tgl]) dataMap[tgl] = [];
                            dataMap[tgl].push(d);
                        }
                    });
                } catch (eAtt) { console.warn('attendances query in riwayat:', eAtt); }

                // Muat juga dari koleksi leaves (izin/sakit baru)
                try {
                    const qLeaves = query(collection(db, 'leaves'), where('user_id', '==', uid));
                    const snapLeaves = await getDocs(qLeaves);
                    snapLeaves.forEach((docSnap) => {
                        const d = docSnap.data();
                        let tgl = d.start_date;
                        if (tgl) {
                            if (!dataMap[tgl]) dataMap[tgl] = [];
                            dataMap[tgl].push({ ...d, status: d.leave_type === 'sakit' ? 'Sakit' : 'Izin' });
                        }
                    });
                } catch (eLeaves) { console.warn('leaves query in riwayat:', eLeaves); }

                globalDataMap = dataMap;

                // Identify default active period
                const today = new Date();
                currentPeriodIndex = 0;
                for (let i = 0; i < periods.length; i++) {
                    const ps = new Date(periods[i].start);
                    const pe = new Date(periods[i].end);
                    pe.setHours(23, 59, 59); // include the whole end day
                    if (today >= ps && today <= pe) {
                        currentPeriodIndex = i;
                        break;
                    }
                }

                renderCalendarForPeriod(currentPeriodIndex);

            } catch (error) {
                console.error(error);
                const el = document.getElementById('calendar-grid');
                if (el) el.innerHTML = `<div style="grid-column: span 7; color:red; padding:20px; font-size:12px;">Gagal memuat rekap: ${error.message}</div>`;
            }
        }

    </script>
</body>

</html>
