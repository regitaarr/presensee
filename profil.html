<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensee MagangHub - Profil Akun</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Palette: Fresh, Vermillion, Sunshine, Clean */
            --fresh: #4ABDAC;
            --fresh-hover: #3ca092;
            --fresh-dark: #206d62;
            --fresh-light: #eef9f8;
            --fresh-border: #aee3db;

            --vermillion: #FC4A1A;
            --vermillion-hover: #e33b0d;
            --vermillion-light: #fff2ef;
            --vermillion-border: #ffb8a5;

            --sunshine: #F7B733;
            --sunshine-hover: #e3a21b;
            --sunshine-light: #fef8ec;
            --sunshine-border: #fce3a7;

            --clean: #DFDCE3;
            --clean-dark: #c2bdcb;
            --clean-light: #f7f6f9;

            --primary: var(--fresh);
            --primary-hover: var(--fresh-hover);
            --primary-light: var(--fresh-light);

            --accent: var(--vermillion);
            --warning: var(--sunshine);
            --danger: var(--vermillion);

            --text-dark: #1e1b24;
            --text-main: #36323f;
            --text-muted: #6e697a;
            --text-light: #9f9aa8;
            --border-color: #dcd8e3;

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient Liquid Mesh Gradient */
        body {
            background-color: #d5d1dc;
            background-image:
                radial-gradient(at 8% 8%, rgba(74, 189, 172, 0.45) 0px, transparent 48%),
                radial-gradient(at 92% 92%, rgba(247, 183, 51, 0.38) 0px, transparent 46%),
                radial-gradient(at 88% 12%, rgba(252, 74, 26, 0.22) 0px, transparent 42%),
                radial-gradient(at 12% 88%, rgba(74, 189, 172, 0.32) 0px, transparent 46%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* Modern Bento / Floating Frame */
        .phone-container {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-2xl);
            box-shadow:
                0 32px 64px -16px rgba(30, 27, 36, 0.22),
                0 0 0 2px rgba(255, 255, 255, 0.85),
                0 0 0 3px rgba(223, 220, 227, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 660px;
            max-height: 94vh;
        }

        /* Dynamic Island Hero Header - Identik dengan Dashboard */
        .header {
            margin: 14px 14px 6px;
            padding: 22px 20px 20px;
            text-align: center;
            background: linear-gradient(135deg, #1b5b52 0%, #4ABDAC 100%);
            border-radius: var(--radius-xl);
            position: relative;
            color: #ffffff;
            box-shadow:
                0 16px 36px -10px rgba(74, 189, 172, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            flex-shrink: 0;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.22), transparent 55%);
            pointer-events: none;
        }

        .header-top-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--fresh);
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(74, 189, 172, 0.35);
        }

        .avatar-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            z-index: 1;
        }

        .avatar-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sunshine), var(--vermillion));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(252, 74, 26, 0.38);
            border: 3.5px solid #ffffff;
        }

        .avatar-online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #10b981;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .user-full-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            color: #ffffff;
            position: relative;
            z-index: 1;
        }

        .user-posisi-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        /* Scrollable content container */
        .content {
            padding: 10px 14px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            background: transparent;
            gap: 12px;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--clean);
            border-radius: 4px;
        }

        /* Bento Section Title */
        .bento-section-title {
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 4px 0 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bento-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            border: 1.5px solid var(--border-color);
            padding: 14px;
            box-shadow: 0 4px 16px rgba(30, 27, 36, 0.04);
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .bento-tile {
            background: var(--clean-light);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 11px 13px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .bento-tile:hover {
            background: #ffffff;
            border-color: var(--fresh-border);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 189, 172, 0.1);
        }

        .tile-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tile-content {
            flex: 1;
            min-width: 0;
        }

        .tile-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 2px;
        }

        .tile-value {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            word-break: break-all;
        }

        /* Chunky Tactile Buttons */
        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: -0.01em;
            text-decoration: none;
            position: relative;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: none !important;
        }

        .btn-danger {
            background: linear-gradient(180deg, #fd6840 0%, #FC4A1A 100%);
            color: #ffffff;
            box-shadow:
                0 8px 20px -4px rgba(252, 74, 26, 0.5),
                0 4px 0 #c42d05,
                inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }

        .btn-outline {
            background: #ffffff;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 0 var(--border-color);
        }

        /* Modern Bottom Navigation Bar (3 Menus: Dashboard, Riwayat, Profil) */
        .bottom-nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-top: 1.5px solid var(--border-color);
            padding: 8px 12px 10px;
            flex-shrink: 0;
            z-index: 10;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 16px;
            flex: 1;
            max-width: 120px;
            border-radius: var(--radius-md);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: -0.01em;
            outline: none;
        }

        .bottom-nav-item svg {
            width: 22px;
            height: 22px;
            transition: all 0.2s ease;
        }

        .bottom-nav-item:hover {
            color: var(--fresh-dark);
            transform: translateY(-2px);
        }

        .bottom-nav-item.active {
            color: var(--fresh-dark);
            background: var(--fresh-light);
        }

        .bottom-nav-item.active svg {
            stroke: var(--fresh-dark);
            stroke-width: 2.5;
        }

        /* Modal Styles */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(30, 27, 36, 0.65);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 14px;
        }

        .modal.active {
            display: flex;
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            border-radius: var(--radius-xl);
            box-shadow: 0 30px 60px -15px rgba(30, 27, 36, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        /* Responsive Breakpoints: Smartphone (Identik dengan Dashboard: Tidak Melayang!) */
        @media (max-width: 768px) {
            body {
                padding: 0;
                align-items: flex-start;
                min-height: 100dvh;
                height: 100dvh;
                overflow: hidden;
            }

            .phone-container {
                border-radius: 0;
                max-width: 100%;
                width: 100%;
                min-height: 100dvh;
                max-height: 100dvh;
                box-shadow: none;
                flex-grow: 1;
            }

            .header {
                margin: 10px 10px 4px;
                border-radius: 20px;
            }

            .content {
                padding: 10px 14px 24px;
            }
        }

        /* Responsive Breakpoints: Tablet & Desktop */
        @media (min-width: 769px) {
            body {
                padding: 30px 20px;
            }

            .phone-container {
                max-width: 980px;
                width: 94%;
                min-height: 640px;
                max-height: 90vh;
                border-radius: var(--radius-2xl);
            }

            .profile-desktop-grid {
                display: grid;
                grid-template-columns: 360px 1fr;
                gap: 20px;
                align-items: start;
            }
        }
    </style>
</head>

    <!-- MODAL: KELUAR DI PROFIL -->
    <div class="modal" id="modal-keluar">
        <div class="modal-content" style="text-align:center; max-width:320px; padding:24px 20px;">
            <img id="img-keluar" src="assets/keluar.jpg" alt="Keluar"
                style="width:140px; height:140px; object-fit:cover; margin:0 auto 14px; display:block; border-radius:18px; box-shadow:0 8px 24px rgba(252,74,26,0.2); border:2px solid var(--vermillion-border);">
            <h3 style="font-size:18px; font-weight:800; color:var(--text-dark); margin-bottom:6px;">Konfirmasi
                Keluar</h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px; line-height:1.45;">Apakah kamu
                yakin ingin keluar dari akun ini?</p>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-outline" id="btn-batal-keluar" style="flex:1;">Batal</button>
                <button class="btn btn-danger" id="btn-konfirm-keluar" style="flex:1;">Ya, Keluar</button>
            </div>
        </div>
    </div>
    </div>

    <!-- Firebase SDK Modular (v10.8) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDe394Hog3cODzHBWgC00jtQybKq_Ul4l4",
            authDomain: "presensee-d653b.firebaseapp.com",
            databaseURL: "https://presensee-d653b-default-rtdb.firebaseio.com",
            projectId: "presensee-d653b",
            storageBucket: "presensee-d653b.firebasestorage.app",
            messagingSenderId: "983111308568",
            appId: "1:983111308568:web:de94c7403005a596083a6d",
            measurementId: "G-9WBWFBFGYQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State variables
        let currentUserData = null;

        function renderProfileData() {
            if (!currentUserData) return;
            const nama = currentUserData.nama || 'Peserta';
            const profNama = document.getElementById('prof-nama');
            if (profNama) profNama.innerText = nama;
            const profAv = document.getElementById('prof-avatar');
            if (profAv) profAv.innerText = nama.charAt(0).toUpperCase();
            const profPos = document.getElementById('prof-posisi');
            if (profPos) profPos.innerText = currentUserData.posisi || 'Asisten Pranata Komputer';
            const profNik = document.getElementById('prof-nik');
            if (profNik) profNik.innerText = currentUserData.nik || '-';
            const profEmail = document.getElementById('prof-email');
            if (profEmail) profEmail.innerText = currentUserData.email || '-';
            const profHp = document.getElementById('prof-hp');
            if (profHp) profHp.innerText = currentUserData.no_hp || '-';
            const profPerus = document.getElementById('prof-perusahaan');
            if (profPerus) profPerus.innerText = currentUserData.perusahaan || 'BPS Kota Banjar';
            const profPeriode = document.getElementById('prof-periode');
            if (profPeriode) profPeriode.innerText = '21 Sep 2026 - 20 Mar 2027';
        }

        // Auth Listeners
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    let userData = null;
                    try {
                        const docSnap = await getDoc(doc(db, "users", user.uid));
                        if (docSnap.exists()) userData = docSnap.data();
                    } catch (eDoc) {
                        console.warn('Gagal membaca users doc:', eDoc);
                    }

                    if (!userData) {
                        userData = {
                            nama: user.displayName || user.email.split('@')[0],
                            posisi: 'Asisten Pranata Komputer',
                            perusahaan: 'BPS Kota Banjar',
                            email: user.email,
                            nik: '-'
                        };
                    }
                    currentUserData = userData;
                    currentUserData.uid = user.uid;
                    renderProfileData();
                } catch (e) {
                    console.warn(e);
                }
            } else {
                window.location.href = "index.html"; // Redirect ke login jika belum login
            }
        });

        // Logout Modal Logic
        const modalKeluar = document.getElementById('modal-keluar');
        document.getElementById('btn-trigger-logout')?.addEventListener('click', () => {
            modalKeluar?.classList.add('active');
        });
        document.getElementById('btn-batal-keluar')?.addEventListener('click', () => {
            modalKeluar?.classList.remove('active');
        });
        document.getElementById('btn-konfirm-keluar')?.addEventListener('click', () => {
            modalKeluar?.classList.remove('active');
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });
        if (modalKeluar) {
            modalKeluar.addEventListener('click', (e) => {
                if (e.target === modalKeluar) modalKeluar.classList.remove('active');
            });
        }
    </script>
</body>
